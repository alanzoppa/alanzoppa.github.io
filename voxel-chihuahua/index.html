<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐾 voxel chihuahua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
<style>
  :root{--ink:#5a4632;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 88% -12%, #ffd3e4 0%, rgba(255,211,228,0) 60%),
      radial-gradient(820px 500px at -12% 112%, #ffe3c2 0%, rgba(255,227,194,0) 55%),
      linear-gradient(158deg,#fdf4e9 0%,#fde8de 52%,#f5dcea 100%);
    height:100vh;overflow:hidden;
  }
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
  .blob.a{width:340px;height:340px;background:#ffd9e6;left:6%;top:-90px}
  .blob.b{width:300px;height:300px;background:#d9e6ff;right:4%;bottom:-80px}
  #stage{position:relative;width:min(960px,100vw);height:620px;overflow:hidden;border-radius:18px}
  #stage canvas{position:absolute;inset:0;display:block;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  .hud{position:absolute;top:16px;left:20px;z-index:4;pointer-events:none}
  .hud h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:800}
  .hud p{margin:3px 0 0;font-size:12.5px;opacity:.75}
  .back{position:absolute;top:18px;right:18px;z-index:5;font-size:12px;font-weight:700;
    color:var(--ink);opacity:.65;text-decoration:none;border-bottom:1px dotted var(--ink)}
  .back:hover{opacity:1}
  .panel{position:absolute;left:16px;bottom:14px;z-index:4;display:flex;flex-direction:column;gap:8px;
    padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.62);
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.85);
    box-shadow:0 8px 24px rgba(120,80,60,.12)}
  .row{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
  .row input[type=range]{width:120px;accent-color:#e0885a}
  .btns{display:flex;gap:8px}
  .btns button{border:0;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;
    background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(120,80,60,.15);cursor:pointer}
  .btns button:active{transform:scale(.95)}
  .hint{position:absolute;right:18px;bottom:14px;z-index:4;font-size:11.5px;opacity:.65;pointer-events:none}
  .heart{position:absolute;z-index:6;pointer-events:none;user-select:none;
    animation:rise 1.15s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-12deg)}
    14%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-230px) scale(1.35) rotate(14deg)}
  }
  #err{position:absolute;top:12px;left:12px;right:12px;z-index:9;color:#b00;font:12px monospace;
    white-space:pre-wrap;display:none;background:#fff8;padding:8px;border-radius:8px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
  <div class="blob a"></div><div class="blob b"></div>
  <div class="hud"><h1>🐾 voxel chihuahua</h1><p id="voxmeta">building…</p></div>
  <a class="back" href="../">← articles</a>
  <div class="panel">
    <div class="row"><span>🌀 spin</span><input id="spin" type="range" min="0" max="120" value="45"></div>
    <div class="row"><span>☀️ light</span><input id="light" type="range" min="0" max="360" value="38"></div>
    <div class="btns"><button id="pause">⏸ pause</button><button id="boop">💗 boop</button></div>
  </div>
  <div class="hint">drag to orbit · scroll to zoom · tap the pup</div>
  <div id="err"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__errs=[]; window.__ready=false; window.__voxCount=0;
const _err=console.error.bind(console);
console.error=(...a)=>{window.__errs.push(a.map(String).join(' '));_err(...a)};
window.addEventListener('error',e=>window.__errs.push(e.message));

/* ---------------- palette ---------------- */
const C={fawn:0xd7a468,fawnLight:0xe6bb7e,cream:0xf7efe0,creamShadow:0xe8d9c2,
 sable:0x9c6b35,ear:0xb8864c,earPink:0xeaa79d,nose:0x241a13,noseSheen:0x4a3629,
 eye:0x1c130e,glint:0xffffff,lash:0x3a2417,brow:0xc69a5e,blush:0xf29d9c,
 tongue:0xf2809e,tongueDark:0xec6f92,collar:0xd94a4a,tag:0xf4c84c,tagDark:0xc9a63c};

/* ---------------- voxel builder — 100×100×100 grid ---------------- */
const vox=new Map(); const key=(x,y,z)=>x+'|'+y+'|'+z;
const setV=(x,y,z,c)=>vox.set(key(x,y,z),{x,y,z,c});
const box=(x0,x1,y0,y1,z0,z1,c)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)setV(x,y,z,c)};
const ell=(cx,cy,cz,rx,ry,rz,c)=>{
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
  for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const dx=(x-cx)/rx,dy=(y-cy)/ry,dz=(z-cz)/rz;
    if(dx*dx+dy*dy+dz*dz<=1.0001)setV(x,y,z,c);
  }};
const recolor=(pred,c)=>{for(const v of vox.values()) if(pred(v.x,v.y,v.z,v.c)) v.c=c;};

/* body: deep chest + barrel rump */
ell(0,32,2, 12,16,12, C.fawn);
ell(0,30,-6, 11,11,13, C.fawn);
/* haunches */
ell(-11,24,-12, 8,13,9, C.fawn);
ell( 11,24,-12, 8,13,9, C.fawn);
/* front legs + forward paws */
box(-13,-8,0,22, 4,10, C.fawn);
box(  8,13,0,22, 4,10, C.fawn);
box(-14,-9,0, 5, 4,16, C.fawn);
box(  9,14,0, 5, 4,16, C.fawn);
/* rear legs + paws */
box(-17,-11,0,14, -16,-10, C.fawn);
box( 11, 17,0,14, -16,-10, C.fawn);
box(-18,-12,0, 4, -16, -8, C.fawn);
box( 12, 18,0, 4, -16, -8, C.fawn);
/* toe splits */
for(const s of [1,-1]){
  for(const tx of [12,10]) for(let y=0;y<=2;y++) for(let z=13;z<=16;z++) vox.delete(key(s*tx,y,z));
  for(const tx of [15,13]) for(let y=0;y<=2;y++) for(let z=-10;z<=-8;z++) vox.delete(key(s*tx,y,z));
}
/* white socks */
recolor((x,y,z,c)=> c===C.fawn && y<=6 && Math.abs(x)>=9  && z>=4  && z<=16, C.cream);
recolor((x,y,z,c)=> c===C.fawn && y<=5 && Math.abs(x)>=12 && z<=-8 && z>=-16, C.cream);
/* neck (deep merge into chest) */
box(-7,7,44,62, -4,8, C.fawn);
/* head: apple dome */
ell(0,74,-2, 17,14,16, C.fawnLight);
/* cheek ruffs */
ell(-13,68,5, 3,4,4, C.fawnLight);
ell( 13,68,5, 3,4,4, C.fawnLight);
/* muzzle */
ell(0,68,12, 7,6,8, C.cream);
/* mouth line */
recolor((x,y,z,c)=> c===C.cream && y===66 && z>=15 && Math.abs(x)<=5, C.creamShadow);
/* mlem tongue with center crease */
ell(0,63,15, 2.6,3.2,2.8, C.tongue);
recolor((x,y,z,c)=> c===C.tongue && x===0, C.tongueDark);
/* button nose + sheen */
box(-4,4,70,73, 17,19, C.nose);
recolor((x,y,z,c)=> c===C.nose && y===73, C.noseSheen);
/* chest bib + belly stripe */
recolor((x,y,z,c)=> c===C.fawn && y>=36 && y<=48 && z>=9 && Math.abs(x)<=9, C.cream);
recolor((x,y,z,c)=> c===C.fawn && y>=24 && y<=36 && z>=5 && Math.abs(x)<=6, C.cream);
/* collar: whole neck slice at y 55-57 (pure neck there) */
recolor((x,y,z,c)=> y>=55 && y<=57, C.collar);
/* gold tag */
box(-2,2,51,55, 8,9, C.tag);
setV(0,53,9,C.tagDark);
/* eyes: big dark pools with lash rim + sparkle */
for(const s of [1,-1]){
  const cx=s*9, cy=75, cz=11;
  const region=[];
  for(const v of vox.values()){
    if(Math.hypot(v.x-cx,(v.y-cy)*1.05,(v.z-cz)*1.15)<4.5 && v.z>=cz-3) region.push(v);
  }
  for(const v of region) v.c=C.eye;
  for(const v of region) if(v.y>=78) v.c=C.lash;
  const gl=region.slice().sort((a,b)=>Math.hypot(a.x-s*6,a.y-78)-Math.hypot(b.x-s*6,b.y-78));
  for(let i=0;i<2&&i<gl.length;i++) gl[i].c=C.glint;
}
/* brow dots */
for(const s of [1,-1]) for(const v of vox.values())
  if(v.c===C.fawnLight && Math.hypot(v.x-s*8,(v.y-82)*1.1,(v.z-8)*1.3)<2) v.c=C.brow;
/* white blaze down the forehead */
recolor((x,y,z,c)=> c===C.fawnLight && Math.abs(x)<=2 && y>=70 && y<=86 && z>=6, C.cream);
/* blush cheeks */
for(const s of [1,-1]) for(const v of vox.values())
  if(v.c===C.fawnLight && Math.hypot(v.x-s*14,(v.y-66)*1.1,(v.z-4)*1.2)<3.6) v.c=C.blush;
/* giant splayed ears, sable rims, pink inner faces */
const earRows=[
 [80,14,21,-8,-1],[81,14,22,-8,-1],[82,14,22,-8, 0],[83,15,23,-8, 0],
 [84,15,23,-7, 0],[85,16,24,-7, 0],[86,16,24,-6, 1],[87,17,25,-6, 1],
 [88,17,25,-5, 1],[89,18,26,-5, 2],[90,19,26,-4, 2],[91,20,26,-4, 2],
 [92,21,27,-3, 2],[93,22,27,-3, 3],[94,23,27,-2, 3],[95,24,27,-1, 3],
 [96,24,26, 0, 3],[97,25,26, 0, 2],[98,25,25, 1, 2]];
for(const s of [1,-1]) for(const [y,x0,x1,z0,z1] of earRows){
  for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)
    setV(s*x,y,z,(x===x0||x===x1||y>=96)?C.sable:C.ear);
  for(let x=x0+1;x<x1;x++){
    setV(s*x,y,z1,C.earPink);
    if(z1-1>z0 && x>x0+1 && x<x1-1) setV(s*x,y,z1-1,C.earPink);
  }
}
/* sickle tail curling over the rump (cream tip) — grafted, skips body voxels */
const tail=[];
for(let a=-20;a<=150;a+=4){
  const rad=a*Math.PI/180;
  const py=34+12*Math.sin(rad), pz=-26+12*Math.cos(rad);
  for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)for(let dz=-2;dz<=2;dz++){
    if(dx*dx+dy*dy+dz*dz>5.5) continue;
    const x=dx, y=Math.round(py)+dy, z=Math.round(pz)+dz;
    if(vox.has(key(x,y,z))) continue;
    setV(x,y,z,a>132?C.cream:C.fawn); tail.push({x,y,z});
  }
}

/* shell extraction: keep only voxels with a missing neighbor (interior is invisible) */
const list=[];
for(const v of vox.values()){
  if( vox.has(key(v.x+1,v.y,v.z))&&vox.has(key(v.x-1,v.y,v.z))&&
      vox.has(key(v.x,v.y+1,v.z))&&vox.has(key(v.x,v.y-1,v.z))&&
      vox.has(key(v.x,v.y,v.z+1))&&vox.has(key(v.x,v.y,v.z-1))) continue;
  list.push(v);
}
const idxOf=new Map(list.map((v,i)=>[key(v.x,v.y,v.z),i]));
let bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9,bz0=1e9,bz1=-1e9;
for(const v of list){bx0=Math.min(bx0,v.x);bx1=Math.max(bx1,v.x);by0=Math.min(by0,v.y);by1=Math.max(by1,v.y);bz0=Math.min(bz0,v.z);bz1=Math.max(bz1,v.z);}
window.__voxCount=list.length;
document.getElementById('voxmeta').textContent=
  `${list.length.toLocaleString()} voxels · 100×100×100 grid · he spins — the light stays put`;

/* ---------------- three.js scene ---------------- */
const K=0.36;                       /* world units per voxel — keeps framing stable */
const geo=new THREE.BoxGeometry(1,1,1);  /* full pitch = gapless cubes */
const mat=new THREE.MeshStandardMaterial({roughness:.92,metalness:0});
const mesh=new THREE.InstancedMesh(geo,mat,list.length);
mesh.castShadow=true; mesh.receiveShadow=true; mesh.frustumCulled=false;
mesh.scale.setScalar(K); mesh.position.z=9*K;
const m4=new THREE.Matrix4(), col=new THREE.Color();
const jit=(x,y,z)=>{const t=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return .965+(t-Math.floor(t))*.07;};
const eyeIds=[],eyeBase=[];
list.forEach((v,i)=>{
  m4.makeTranslation(v.x,v.y,v.z); mesh.setMatrixAt(i,m4);
  col.setHex(v.c).multiplyScalar(jit(v.x,v.y,v.z));
  mesh.setColorAt(i,col);
  if(v.c===C.eye||v.c===C.glint||v.c===C.lash){eyeIds.push(i);eyeBase.push(v.c);}
});
mesh.instanceColor.needsUpdate=true;

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,stage.clientWidth/stage.clientHeight,.1,400);
camera.position.set(36,28,57);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,14,-1); controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=26; controls.maxDistance=120; controls.maxPolarAngle=Math.PI*.55;

/* the pup spins inside this group; every light stays FIXED in world space */
const dog=new THREE.Group(); dog.add(mesh); scene.add(dog);

scene.add(new THREE.HemisphereLight(0xcfe3ff,0xf2d8b0,.8));
const sun=new THREE.DirectionalLight(0xfff1dd,2.7);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;
sc.left=-20; sc.right=20; sc.top=40; sc.bottom=-10; sc.near=2; sc.far=90;
sc.updateProjectionMatrix();
sun.shadow.bias=-.0002; sun.shadow.normalBias=.02;
sun.target.position.set(0,10,0);
scene.add(sun,sun.target);
const rim=new THREE.DirectionalLight(0x9fc2ff,1.15); rim.position.set(-14,10,-16); scene.add(rim);
const setSunAz=deg=>{const a=deg*Math.PI/180; sun.position.set(Math.sin(a)*14,17,Math.cos(a)*14);};
setSunAz(38);

const ground=new THREE.Mesh(new THREE.CircleGeometry(34,48), new THREE.ShadowMaterial({opacity:.22}));
ground.rotation.x=-Math.PI/2; ground.position.y=-.19; ground.receiveShadow=true; scene.add(ground);

/* tail wag — pivot at the tail base, world-space instance rotation */
const PIV={x:0,y:31,z:-15};
const tailIdx=[];
for(const t of tail){const i=idxOf.get(key(t.x,t.y,t.z)); if(i!==undefined) tailIdx.push({i,x:t.x,y:t.y,z:t.z});}
const rotM=new THREE.Matrix4(), tmpM=new THREE.Matrix4(), wagM=new THREE.Matrix4();
function applyWag(a){
  rotM.makeRotationY(a);
  for(const t of tailIdx){
    tmpM.makeTranslation(t.x-PIV.x,t.y-PIV.y,t.z-PIV.z);
    wagM.multiplyMatrices(rotM,tmpM);
    tmpM.makeTranslation(PIV.x,PIV.y,PIV.z);
    wagM.premultiply(tmpM);
    mesh.setMatrixAt(t.i,wagM);
  }
  mesh.instanceMatrix.needsUpdate=true;
}
/* blinking — closed eyes get a dark lash line at the bottom */
let eyeOpen=true;
function setEyes(open){
  eyeOpen=open;
  for(let k=0;k<eyeIds.length;k++){
    const v=list[eyeIds[k]];
    col.setHex(open?eyeBase[k]:(v.y<=72?C.lash:C.fawnLight));
    mesh.setColorAt(eyeIds[k],col);
  }
  mesh.instanceColor.needsUpdate=true;
}

/* hearts */
let wagBoostUntil=0;
function heartBurst(cx,cy){
  const r=stage.getBoundingClientRect();
  const emojis=['💗','💕','💖','🐾'];
  for(let i=0;i<8;i++){
    const h=document.createElement('div'); h.className='heart';
    h.textContent=emojis[i%4];
    h.style.left=(cx-r.left+(Math.random()*50-25))+'px';
    h.style.top =(cy-r.top +(Math.random()*14-7))+'px';
    h.style.animationDelay=(Math.random()*.12)+'s';
    h.style.fontSize=(15+Math.random()*15)+'px';
    stage.appendChild(h); setTimeout(()=>h.remove(),1400);
  }
}
const boopBtn=document.getElementById('boop');
function boop(cx,cy){ wagBoostUntil=performance.now()+2200; heartBurst(cx,cy); }
boopBtn.addEventListener('click',()=>{const b=boopBtn.getBoundingClientRect();boop(b.left+b.width/2,b.top);});
renderer.domElement.addEventListener('pointerdown',e=>boop(e.clientX,e.clientY));

/* controls */
let spinOn=true, spinSpeed=.45;
document.getElementById('spin').addEventListener('input',e=>spinSpeed=e.target.value/100);
document.getElementById('light').addEventListener('input',e=>setSunAz(+e.target.value));
const pauseBtn=document.getElementById('pause');
pauseBtn.addEventListener('click',()=>{spinOn=!spinOn;pauseBtn.textContent=spinOn?'⏸ pause':'▶ play';});

/* shareable poses via URL: ?pose=180&light=120&spin=1.2 (deg / deg / rad-per-sec) */
{
  const q=new URLSearchParams(location.search);
  if(q.has('pose')){ dog.rotation.y=(+q.get('pose')||0)*Math.PI/180;
    spinOn=false; pauseBtn.textContent='▶ play'; }
  const L=q.get('light'); if(L!==null){ setSunAz(+L||0); document.getElementById('light').value=L; }
  const s=q.get('spin'); if(s!==null){ spinSpeed=+s||0; document.getElementById('spin').value=Math.min(120,Math.round(spinSpeed*100)); }
}

/* main loop */
let t=0,last=performance.now(),nextBlink=performance.now()+2800,blinkEnd=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05); last=now; t+=dt;
  if(spinOn) dog.rotation.y+=spinSpeed*dt;      // pup rotates…
  const boost=now<wagBoostUntil;               // …light never does
  applyWag((boost?.38:.15)*Math.sin(t*(boost?10:3.2)));
  if(now>nextBlink){ setEyes(false); blinkEnd=now+140; nextBlink=now+2600+Math.random()*3200; }
  else if(blinkEnd&&now>blinkEnd){ setEyes(true); blinkEnd=0; }
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

new ResizeObserver(()=>{
  const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h)return;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}).observe(stage);

/* test hooks */
window.__sample=()=>{try{
  const src=renderer.domElement;
  const c2=document.createElement('canvas'); c2.width=160;c2.height=160;
  const g=c2.getContext('2d');
  g.drawImage(src,(src.width-160)/2,(src.height-160)/2,160,160,0,0,160,160);
  const d=g.getImageData(0,0,160,160).data; let h=0;
  for(let i=0;i<d.length;i+=101)h=(h*31+d[i])>>>0;
  return h;
}catch(e){return 'ERR '+e.message}};
/* scene-state analysis: canvas alpha isolates voxels (opaque) from shadow (α≈.22) */
window.__analyze=()=>{try{
  const src=renderer.domElement, w=src.width, h=src.height;
  const c2=document.createElement('canvas'); c2.width=w; c2.height=h;
  const g=c2.getContext('2d'); g.drawImage(src,0,0);
  const d=g.getImageData(0,0,w,h).data;
  let n=0,x0=1e9,x1=-1,y0=1e9,y1=-1;
  const bright=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(d[i+3]<200) continue;
    n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    bright.push([lum,x,y]);
  }
  if(!n) return {err:'no dog pixels'};
  bright.sort((a,b)=>b[0]-a[0]);
  const top=bright.slice(0,Math.max(1,n>>6));
  const hx=top.reduce((s,p)=>s+p[1],0)/top.length;
  const hy=top.reduce((s,p)=>s+p[2],0)/top.length;
  const cx=(x0+x1)/2, bw=x1-x0||1;
  return {n, bbox:[x0,y0,x1,y1],
    voxels:list.length,
    grid:{x:[bx0,bx1],y:[by0,by1],z:[bz0,bz1],
      spans:{x:bx1-bx0+1,y:by1-by0+1,z:bz1-bz0+1}},
    pose_deg:Math.round(dog.rotation.y*180/Math.PI*10)/10,
    sun:[Math.round(sun.position.x*10)/10,Math.round(sun.position.y*10)/10,Math.round(sun.position.z*10)/10],
    light_slider:document.getElementById('light').value,
    spin:spinSpeed, spinOn,
    rel:Math.round((hx-cx)/bw*1000)/1000,
    rel_y:Math.round((hy-y0)/(y1-y0||1)*100)/100};
}catch(e){return {err:e.message}}};
window.__ready=true;
/* gap check: vertical column runs through the dog ON THE CANVAS (alpha isolates dog
   from page bg; PNG screenshots flatten the bg and are useless for this) */
window.__gapcheck=()=>{try{
  const src=renderer.domElement, w=src.width, h=src.height;
  const c2=document.createElement('canvas'); c2.width=w; c2.height=h;
  const g=c2.getContext('2d'); g.drawImage(src,0,0);
  const d=g.getImageData(0,0,w,h).data;
  let checked=0, withHoles=0;
  for(let x=0;x<w;x++){
    const ys=[];
    for(let y=0;y<h;y++) if(d[(y*w+x)*4+3]>=200) ys.push(y);
    if(ys.length<40) continue;               // column must pass through real dog mass
    checked++;
    let holes=0;
    for(let i=1;i<ys.length;i++) if(ys[i]-ys[i-1]===2) holes++;  // 1px internal gap
    if(holes) withHoles++;
  }
  return {checked, withHoles};
}catch(e){return {err:e.message}}};
window.__holes=()=>{try{
  const src=renderer.domElement, w=src.width, h=src.height;
  const c2=document.createElement('canvas'); c2.width=w; c2.height=h;
  const g=c2.getContext('2d'); g.drawImage(src,0,0);
  const d=g.getImageData(0,0,w,h).data;
  const holes=[];
  for(let x=0;x<w;x++){
    const ys=[]; for(let y=0;y<h;y++) if(d[(y*w+x)*4+3]>=200) ys.push(y);
    if(ys.length<40) continue;
    for(let i=1;i<ys.length;i++) if(ys[i]-ys[i-1]===2)
      holes.push({x, above:ys[i-1], below:ys[i]});
  }
  return holes;
}catch(e){return {err:e.message}}};
setTimeout(()=>{ if(window.__errs.length){ const d=document.getElementById('err');
  d.style.display='block'; d.textContent=window.__errs.join('\n'); } },1500);
</script>
