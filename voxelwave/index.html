<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOXELWAVE</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04010e}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  .fx{position:fixed;inset:0;pointer-events:none}
  #scan{background:repeating-linear-gradient(0deg,rgba(3,0,14,.20) 0 1px,transparent 1px 3px)}
  #vig{background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(3,0,14,.60) 100%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan" class="fx"></div>
<a class="back" href="../" style="position:fixed;top:16px;left:16px;z-index:50;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:rgba(255,255,255,.85);text-decoration:none;background:rgba(20,4,40,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;backdrop-filter:blur(6px)">← home</a>
<div id="vig" class="fx"></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
window.__errors = []; window.__fps = 0; window.__cols = 0; window.__palms = 0;
window.addEventListener('error', e => window.__errors.push(String(e.message)));
cv.addEventListener('click', () => { paused = !paused; });

// ---------- world constants ----------
const ROAD = 5;     // half-width of the glowing highway (lateral units)
const RISE = 13;     // lateral distance over which mountains reach full height
const HMAX = 15;     // max mountain height (voxels)
const SPEED = 3.6;   // scroll rows per second

let W=0,H=0,DPR=1,TW=52,HW=26,hh=13,VZ=26,HOR=0,CR=0,UD=0,EXTRA=0;
let sunCv=null,SUNR=0,stars=[];
let t=0, uiT=0, last=performance.now(), paused=false, fpsN=0, fpsT=0;

// ---------- value noise ----------
const hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);};
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){let s=0,a=.5,f=1,n=0;for(let i=0;i<4;i++){s+=vnoise(x*f,y*f)*a;n+=a;a*=.5;f*=2.03}return s/n}

// ---------- palette ----------
const rgbA=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const lerp=(a,b,u)=>a+(b-a)*u;
const RAMP=[];   // RAMP[h][variant] = [top, right, left]
{
  const lo=[58,17,96], hi=[255,79,174], capA=[255,143,208], capB=[255,233,248];
  for(let h=0;h<=HMAX;h++){
    const u=Math.min(1,h/HMAX);
    let base=[0,1,2].map(i=>lerp(lo[i],hi[i],Math.pow(u,0.9)));
    if(h>=HMAX-2){const v=(h-(HMAX-2))/2;base=[0,1,2].map(i=>lerp(capA[i],capB[i],v*0.8));}
    RAMP.push([0.94,1,1.06].map(m=>[
      rgbA(base.map(c=>lerp(c,255,0.32)*m)),
      rgbA(base.map(c=>c*0.45*m)),
      rgbA(base.map(c=>c*0.72*m))
    ]));
  }
}
const LEAFC  = [rgbA([46,240,201]), rgbA([10,110,96]),   rgbA([18,158,124])];
const CROWNC = [rgbA([255,113,206]), rgbA([140,26,100]), rgbA([190,56,140])];
const TRUNKC = [rgbA([185,90,196]), rgbA([70,20,95]),    rgbA([120,44,140])];

// ---------- terrain ----------
function terrainH(gx,gy){
  const d=Math.abs(gx-gy)-ROAD;
  if(d<=0) return 0;
  const amp=Math.min(1,d/RISE);
  let n=(fbm(gx*0.045,gy*0.045)-0.24)/0.76;
  if(n<=0) return 0;
  n=Math.pow(n,1.2);
  let h=Math.floor(n*HMAX*Math.pow(amp,1.35)+amp*1.6);
  return h>HMAX?HMAX:h;
}

// ---------- sun ----------
function makeSun(R){
  const S=R*2+8, s=document.createElement('canvas');
  s.width=s.height=S;
  const g=s.getContext('2d');
  const gr=g.createLinearGradient(0,4,0,S-4);
  gr.addColorStop(0,'#fff9ae');gr.addColorStop(0.42,'#ffc46b');
  gr.addColorStop(0.72,'#ff5e9e');gr.addColorStop(1,'#ff2a92');
  g.fillStyle=gr;g.beginPath();g.arc(S/2,S/2,R,0,7);g.fill();
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<6;i++) g.fillRect(0,S/2+R*0.08+i*R*0.145,S,1.5+i*2.2);
  return s;
}

// ---------- layout ----------
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  TW=Math.max(44,Math.min(84,Math.round(H/14)));
  HW=Math.round(TW/2);          // half tile width
  hh=Math.round(TW/4);          // half tile height (diamond half)
  VZ=2*hh;                      // voxel vertical step
  HOR=Math.round(H*0.40);
  CR=Math.ceil((W/2+TW*2)/HW);
  UD=Math.ceil((H-HOR)/hh)+2;
  EXTRA=Math.ceil(HOR/hh)+2;
  SUNR=Math.round(Math.min(H*0.17,W*0.11));
  sunCv=makeSun(SUNR);
  stars=[];
  const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*HOR*0.96,r:Math.random()*1.6+0.6,sp:Math.random()*2+0.6,ph:Math.random()*6.283});
}

// ---------- draw primitives ----------
function drawFloor(x,y,gx,gy){
  const inRoad=Math.abs(gx-gy)<=ROAD;
  ctx.fillStyle=inRoad?(((Math.floor(gx)+Math.floor(gy))&1)?'#1c0638':'#170531'):'#0c0120';
  ctx.beginPath();
  ctx.moveTo(x,y-hh);ctx.lineTo(x+HW,y);ctx.lineTo(x,y+hh);ctx.lineTo(x-HW,y);ctx.closePath();
  ctx.fill();
  if(inRoad){
    const bright=(Math.floor(gx+gy)%5===0);
    ctx.strokeStyle=bright?'rgba(1,205,254,0.85)':'rgba(1,205,254,0.30)';
    ctx.lineWidth=bright?1.6:1;
  }else{
    ctx.strokeStyle='rgba(123,58,214,0.22)';ctx.lineWidth=1;
  }
  ctx.stroke();
}

function drawCol(x,baseY,h,vi){
  const yT=baseY-h*VZ,S=h*VZ,c=RAMP[h][vi];
  ctx.fillStyle=c[1];
  ctx.beginPath();ctx.moveTo(x,yT+hh);ctx.lineTo(x+HW,yT);ctx.lineTo(x+HW,yT+S);ctx.lineTo(x,yT+hh+S);ctx.closePath();ctx.fill();
  ctx.fillStyle=c[2];
  ctx.beginPath();ctx.moveTo(x,yT+hh);ctx.lineTo(x-HW,yT);ctx.lineTo(x-HW,yT+S);ctx.lineTo(x,yT+hh+S);ctx.closePath();ctx.fill();
  ctx.fillStyle=c[0];
  ctx.beginPath();ctx.moveTo(x,yT-hh);ctx.lineTo(x+HW,yT);ctx.lineTo(x,yT+hh);ctx.lineTo(x-HW,yT);ctx.closePath();ctx.fill();
}

function cube(cx,gy,zb,c){
  const yT=gy-(zb+1)*VZ;
  ctx.fillStyle=c[1];
  ctx.beginPath();ctx.moveTo(cx,yT+hh);ctx.lineTo(cx+HW,yT);ctx.lineTo(cx+HW,yT+VZ);ctx.lineTo(cx,yT+hh+VZ);ctx.closePath();ctx.fill();
  ctx.fillStyle=c[2];
  ctx.beginPath();ctx.moveTo(cx,yT+hh);ctx.lineTo(cx-HW,yT);ctx.lineTo(cx-HW,yT+VZ);ctx.lineTo(cx,yT+hh+VZ);ctx.closePath();ctx.fill();
  ctx.fillStyle=c[0];
  ctx.beginPath();ctx.moveTo(cx,yT-hh);ctx.lineTo(cx+HW,yT);ctx.lineTo(cx,yT+hh);ctx.lineTo(cx-HW,yT);ctx.closePath();ctx.fill();
}

// ---------- palms (ride the scrolling terrain, fade in/out smoothly) ----------
function maybePalm(x,baseY,gx,gy){
  const i=Math.round(gx),j=Math.round(gy);
  const d=Math.abs(i-j)-ROAD;
  if(d<1||d>6) return false;
  if(hash(i*7.13+13,j*7.71+31)>0.14) return false;
  const h=terrainH(i,j);
  if(h>3) return false;
  const f=Math.abs(gx-i)+Math.abs(gy-j);
  const a=1.6-f*2.4;
  if(a<=0.03) return false;
  ctx.globalAlpha=a>1?1:a;
  drawPalm(x,baseY,h);
  ctx.globalAlpha=1;
  return true;
}
function drawPalm(x,baseY,h){
  const topZ=h+3;
  const put=(a,b,z,c)=>cube(x+(a-b)*HW, baseY+(a+b)*hh, z, c);
  put(-1,0,topZ-1,LEAFC); put(0,-1,topZ-1,LEAFC);      // back fronds
  put(-2,0,topZ-2,LEAFC); put(0,-2,topZ-2,LEAFC);
  const yT=baseY-topZ*VZ, S=3*VZ;                      // trunk
  ctx.fillStyle=TRUNKC[1];
  ctx.beginPath();ctx.moveTo(x,yT+hh);ctx.lineTo(x+HW,yT);ctx.lineTo(x+HW,yT+S);ctx.lineTo(x,yT+hh+S);ctx.closePath();ctx.fill();
  ctx.fillStyle=TRUNKC[2];
  ctx.beginPath();ctx.moveTo(x,yT+hh);ctx.lineTo(x-HW,yT);ctx.lineTo(x-HW,yT+S);ctx.lineTo(x,yT+hh+S);ctx.closePath();ctx.fill();
  put(0,0,topZ,CROWNC);                                // pink crown cube
  put(1,0,topZ-1,LEAFC); put(0,1,topZ-1,LEAFC);         // front fronds
  put(2,0,topZ-2,LEAFC); put(0,2,topZ-2,LEAFC);
}

// ---------- title ----------
function spacedText(str,x,y,gap){
  const ws=[],n=str.length;let tot=0;
  for(let i=0;i<n;i++){const w=ctx.measureText(str[i]).width;ws.push(w);tot+=w+gap}
  tot-=gap;let px=x-tot/2;
  for(let i=0;i<n;i++){ctx.fillText(str[i],px+ws[i]/2,y);px+=ws[i]+gap}
}
function drawTitle(){
  const fs=Math.round(Math.max(30,H*0.058));
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`700 ${fs}px "Courier New",monospace`;
  const y=H*0.12+Math.sin(uiT*0.8)*5;
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(1,205,254,.75)';spacedText('VOXELWAVE',W/2-3,y,fs*0.22);
  ctx.fillStyle='rgba(255,47,146,.75)';spacedText('VOXELWAVE',W/2+3,y,fs*0.22);
  ctx.fillStyle='rgba(255,255,255,.95)';spacedText('VOXELWAVE',W/2,y,fs*0.22);
  ctx.font=`400 ${Math.round(fs*0.30)}px "Courier New",monospace`;
  ctx.fillStyle='rgba(185,238,255,.72)';
  spacedText('NEON TERRAIN // 1984',W/2,y+fs*0.95,fs*0.10);
  ctx.restore();
}

// ---------- main draw ----------
function draw(){
  const CX=W/2+Math.sin(t*0.16)*W*0.015;
  // sky
  const sky=ctx.createLinearGradient(0,0,0,HOR+2);
  sky.addColorStop(0,'#04010e');sky.addColorStop(0.38,'#1c0646');
  sky.addColorStop(0.66,'#4c0f7c');sky.addColorStop(0.86,'#93207f');sky.addColorStop(1,'#e0399b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,HOR+2);
  ctx.fillStyle='#07010f';ctx.fillRect(0,HOR,W,H-HOR);
  // stars
  for(const s of stars){
    ctx.globalAlpha=0.20+0.80*(0.5+0.5*Math.sin(uiT*s.sp+s.ph));
    ctx.fillStyle='#cfe8ff';ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  // sun (fixed X: infinitely far, no parallax with camera sway)
  const sunX=W/2, sunY=HOR-SUNR*0.30;
  ctx.drawImage(sunCv,sunX-SUNR-4,sunY-SUNR-4);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(sunX,sunY,SUNR*0.55,sunX,sunY,SUNR*2.5);
  hg.addColorStop(0,'rgba(255,90,170,0.32)');hg.addColorStop(1,'rgba(255,90,170,0)');
  ctx.fillStyle=hg;ctx.fillRect(sunX-SUNR*2.5,sunY-SUNR*2.5,SUNR*5,SUNR*5);
  ctx.restore();
  // terrain (painter's algorithm: far rows first, straight vertical scroll)
  let drawn=0,palms=0;
  for(let r=-EXTRA;r<=UD;r++){
    const baseY=HOR+r*hh;
    if(baseY<-VZ) continue;
    for(let c=-CR;c<=CR;c++){
      if((c^r)&1) continue;
      const x=CX+c*HW;
      if(x+HW<0||x-HW>W) continue;
      const gx=(r-2*t+c)/2, gy=(r-2*t-c)/2;
      const h=terrainH(gx,gy);
      drawn++;
      if(h===0){
        if(r>=0 && baseY-hh<H+4) drawFloor(x,baseY,gx,gy);
        continue;
      }
      const yT=baseY-h*VZ;
      if(yT-hh>H+4) continue;
      const vi=(hash(Math.floor(gx)*0.37+7,Math.floor(gy)*0.53+3)*3)|0;
      drawCol(x,baseY,h,vi);
      if(r>=1&&maybePalm(x,baseY,gx,gy)) palms++;
    }
  }
  window.__cols=drawn;window.__palms=palms;
  // horizon haze
  ctx.save();ctx.globalCompositeOperation='lighter';
  const hz=ctx.createLinearGradient(0,HOR-50,0,HOR+60);
  hz.addColorStop(0,'rgba(255,62,152,0)');hz.addColorStop(0.45,'rgba(255,62,152,0.20)');hz.addColorStop(1,'rgba(255,62,152,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,HOR-50,W,110);
  // neon pool on the road
  const rg=ctx.createLinearGradient(0,HOR,0,H);
  rg.addColorStop(0,'rgba(255,47,146,0.16)');rg.addColorStop(0.5,'rgba(255,47,146,0.05)');rg.addColorStop(1,'rgba(1,205,254,0.10)');
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.moveTo(CX-30,HOR);ctx.lineTo(CX+30,HOR);ctx.lineTo(CX+W*0.35,H);ctx.lineTo(CX-W*0.35,H);ctx.closePath();ctx.fill();
  ctx.restore();
  drawTitle();
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.06,(now-last)/1000);last=now;uiT+=dt;
  fpsN++;fpsT+=dt;
  if(fpsT>=0.5){window.__fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;}
  if(!paused)t+=dt*SPEED;
  draw();
}
resize();
window.addEventListener('resize',resize);
// test hook: manually advance the animation (headless browsers throttle rAF)
window.__step=(dt)=>{t+=dt*SPEED;uiT+=dt;draw();};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
