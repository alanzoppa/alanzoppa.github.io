<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Embeddings in 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #a0a0b0;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #info h1 {
      color: #e8e8f0;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    #info .legend {
      margin-top: 12px;
      display: flex;
      gap: 16px;
    }
    #info .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    #info .legend .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #606070;
      font-size: 14px;
      letter-spacing: 0.05em;
      z-index: 20;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="loading">Loading embeddings...</div>
    <div id="info">
      <h1>Word Embeddings in 3D</h1>
      <div>12 words across 3 languages</div>
      <div>PCA projection (78.4% variance explained)</div>
      <div class="legend">
        <span><span class="dot" style="background:#4fc3f7;box-shadow:0 0 6px #4fc3f7;"></span> English</span>
        <span><span class="dot" style="background:#ffb74d;box-shadow:0 0 6px #ffb74d;"></span> Spanish</span>
        <span><span class="dot" style="background:#ff8a80;box-shadow:0 0 6px #ff8a80;"></span> Chinese</span>
      </div>
      <div style="margin-top:12px;font-size:11px;color:#606070;">
        Drag to orbit · Scroll to zoom · Right-drag to pan
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const container = document.getElementById('canvas-container');
    const loading = document.getElementById('loading');

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    // Post-processing: subtle bloom only
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.3,  // strength (gentle)
      0.3,  // radius
      0.7   // threshold (only very bright things bloom)
    );
    composer.addPass(bloomPass);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.minDistance = 1;
    controls.maxDistance = 15;

    // Inline data — no web server needed
    const points = [
      {"word":"man","x":-0.261448,"y":-0.055642,"z":-0.385663},
      {"word":"woman","x":-0.307028,"y":-0.303211,"z":0.227338},
      {"word":"uncle","x":0.363269,"y":-0.099579,"z":-0.216688},
      {"word":"aunt","x":0.347049,"y":-0.206396,"z":0.135377},
      {"word":"hombre","x":-0.30541,"y":-0.071066,"z":-0.399092},
      {"word":"mujer","x":-0.324482,"y":-0.31484,"z":0.210732},
      {"word":"tío","x":0.331585,"y":-0.166382,"z":-0.168},
      {"word":"tía","x":0.247764,"y":-0.247873,"z":0.111107},
      {"word":"男人","x":-0.336855,"y":0.470976,"z":-0.195762},
      {"word":"女人","x":-0.342505,"y":0.227481,"z":0.410506},
      {"word":"叔叔","x":0.361001,"y":0.413586,"z":-0.084446},
      {"word":"阿姨","x":0.227061,"y":0.352947,"z":0.354591}
    ];

    function getLanguageColor(word) {
      const en = ['man','woman','uncle','aunt'];
      const es = ['hombre','mujer','tío','tía'];
      if (en.includes(word)) return new THREE.Color(0x4fc3f7);  // cyan-blue
      if (es.includes(word)) return new THREE.Color(0xffb74d);  // orange
      return new THREE.Color(0xff8a80);  // pink-red for Chinese
    }

    function getLanguageGroup(word) {
      const en = ['man','woman','uncle','aunt'];
      const es = ['hombre','mujer','tío','tía'];
      if (en.includes(word)) return 'en';
      if (es.includes(word)) return 'es';
      return 'zh';
    }

    function getSemanticGroup(word) {
      const male = ['man','hombre','tío','男人','uncle','叔叔'];
      const female = ['woman','mujer','tía','女人','aunt','阿姨'];
      if (male.includes(word)) return 'male';
      if (female.includes(word)) return 'female';
      return 'other';
    }

    function createLabelSprite(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fontSize = 56;
      ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
      const metrics = ctx.measureText(text);
      const padX = 20;
      const padY = 12;
      const width = metrics.width + padX * 2;
      const height = fontSize + padY * 2;
      canvas.width = width;
      canvas.height = height;

      ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Dark rounded backing for contrast
      ctx.fillStyle = 'rgba(5, 5, 8, 0.82)';
      roundRect(ctx, 0, 0, width, height, 8);
      ctx.fill();

      // Language-colored underline strip
      ctx.fillStyle = color;
      roundRect(ctx, 4, height - 6, width - 8, 4, 2);
      ctx.fill();

      // Text
      ctx.fillStyle = '#e8e8f0';
      ctx.fillText(text, width / 2, height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      const scale = 0.005;
      sprite.scale.set(width * scale, height * scale, 1);
      return sprite;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function init() {
      loading.style.display = 'none';

      // Find bounds for normalization
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      let minZ = Infinity, maxZ = -Infinity;
      for (const p of points) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
      }

      // Normalize to roughly -2 to 2 range
      const scale = 2.5 / Math.max(maxX - minX, maxY - minY, maxZ - minZ);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const cz = (minZ + maxZ) / 2;

      const normalized = points.map(p => ({
        word: p.word,
        x: (p.x - cx) * scale,
        y: (p.y - cy) * scale,
        z: (p.z - cz) * scale,
      }));

      // Group by semantic meaning for connections
      const groups = { male: [], female: [] };
      for (const p of normalized) {
        const sg = getSemanticGroup(p.word);
        if (sg === 'male') groups.male.push(p);
        else if (sg === 'female') groups.female.push(p);
      }

      // Create spheres and labels
      const sphereGeo = new THREE.SphereGeometry(0.08, 32, 32);

      for (const p of normalized) {
        const color = getLanguageColor(p.word);

        // Core sphere
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        mesh.position.set(p.x, p.y, p.z);
        scene.add(mesh);

        // Outer glow (subtle halo)
        const glowGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.06,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(mesh.position);
        scene.add(glow);

        // Label
        const colorHex = '#' + color.getHexString();
        const label = createLabelSprite(p.word, colorHex);
        label.position.set(p.x, p.y + 0.4, p.z);
        scene.add(label);
      }

      // Connecting lines between same-meaning words
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x404050,
        transparent: true,
        opacity: 0.25,
      });

      for (const groupName of Object.keys(groups)) {
        const group = groups[groupName];
        for (let i = 0; i < group.length; i++) {
          for (let j = i + 1; j < group.length; j++) {
            const a = group[i];
            const b = group[j];
            // Only connect different languages
            if (getLanguageGroup(a.word) !== getLanguageGroup(b.word)) {
              const geo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(a.x, a.y, a.z),
                new THREE.Vector3(b.x, b.y, b.z),
              ]);
              const line = new THREE.Line(geo, lineMat);
              scene.add(line);
            }
          }
        }
      }

      // Starfield background
      const starGeo = new THREE.BufferGeometry();
      const starCount = 800;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 40;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x505060, size: 0.02 });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);
    }

    init();

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      composer.render();
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
